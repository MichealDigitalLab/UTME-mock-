<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1324"><title>Elite Mode UTME CBT Mock</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#132033;--muted:#65748a;--line:#dbe2ec;--accent:#1646c8;--accent2:#0d358f;--good:#138a4b;--bad:#c93434;--warn:#b66a00;--flag:#8b42c8;--shadow:0 8px 30px rgba(22,42,75,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.hidden{display:none!important}.screen{min-height:100vh}.intro{max-width:760px;margin:auto;padding:34px 18px}.brand{font-weight:800;letter-spacing:.08em;color:var(--accent);font-size:.8rem}.intro h1{font-size:clamp(1.8rem,7vw,3rem);margin:.5rem 0}.intro p{color:var(--muted);line-height:1.6}.rules{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:22px 0;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:1.1rem}.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 20px;font-weight:800;width:100%}.primary:hover{background:var(--accent2)}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.toprow{max-width:1200px;margin:auto;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}.subject{font-weight:800}.timer{font-variant-numeric:tabular-nums;font-weight:900;background:#101b30;color:#fff;border-radius:9px;padding:8px 10px}.timer.warn{background:#a35d00}.timer.danger{background:#9f2020}.progress{height:5px;background:#e8edf5}.progress>i{display:block;height:100%;background:var(--accent);width:0}.wrap{max-width:1200px;margin:auto;padding:14px}.subjectbar{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:.86rem}.chip.active{background:#e9efff;border-color:#b9c9ff;color:var(--accent);font-weight:800}.chip b{margin-left:5px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.qcard{padding:18px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.88rem;margin-bottom:15px}.qtext{font-size:clamp(1rem,2.4vw,1.18rem);line-height:1.65;font-weight:650;white-space:pre-wrap}.options{display:grid;gap:10px;margin-top:18px}.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px;min-height:50px;color:var(--ink)}.opt:hover{border-color:#8fa8e9}.opt.selected{border-color:var(--accent);background:#edf2ff}.letter{width:28px;height:28px;border:1px solid #b8c3d3;border-radius:50%;display:grid;place-items:center;flex:0 0 28px;font-weight:800}.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}.nav{display:flex;gap:9px;margin-top:14px}.nav button{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;font-weight:750}.nav .next{background:var(--accent);color:#fff;border-color:var(--accent)}.side{padding:14px}.side h3{margin:4px 0 12px}.legend{display:flex;gap:7px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-bottom:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;background:#e4e9f1}.dot.a{background:var(--good)}.dot.f{background:var(--flag)}.dot.c{background:var(--accent)}.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:420px;overflow:auto}.num{border:1px solid var(--line);background:#fff;border-radius:8px;aspect-ratio:1;padding:0;font-size:.75rem}.num.answered{background:#e9f7f0;border-color:#a9dfc2}.num.flagged{box-shadow:inset 0 -3px 0 var(--flag)}.num.current{outline:2px solid var(--accent);outline-offset:1px}.num.section{border-radius:8px}.actions{display:flex;gap:8px;margin-top:12px}.small{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.flag.on{color:var(--flag);border-color:#d5b8eb;background:#faf4ff}.submit{background:#152238;color:#fff;border-color:#152238}.sideStats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.sideStat{background:#f6f8fb;border-radius:9px;padding:9px;font-size:.78rem}.sideStat b{display:block;font-size:1rem}
.result{max-width:1100px;margin:auto;padding:22px 14px 50px}.scorehero{background:#111c30;color:#fff;border-radius:18px;padding:22px}.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.scorebox{background:rgba(255,255,255,.08);border-radius:10px;padding:12px}.scorebox b{display:block;font-size:1.2rem}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.resultcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.bar{height:9px;background:#edf0f5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.errors{display:grid;gap:9px}.err{border:1px solid var(--line);border-radius:11px;padding:12px}.err strong{display:block}.review{margin-top:14px}.review .qtext{font-size:1rem}.answerTag{display:inline-block;border-radius:8px;padding:5px 8px;font-size:.8rem;font-weight:800;margin:3px}.correct{background:#e7f7ef;color:#08753d}.wrong{background:#fdeaea;color:#a52121}.muted{color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:1fr}.side{order:2}.nums{max-height:230px}.scoregrid{grid-template-columns:repeat(2,1fr)}.resultgrid{grid-template-columns:1fr}.toprow{padding:8px 10px}.subject{font-size:.85rem}.timer{font-size:.9rem}.qcard{padding:14px}.qtext{line-height:1.55}.nav button{padding:13px 8px}.intro{padding-top:25px}}
</style></head><body><div id="app"></div>
<script>
const BANK=[{"subject": "English", "q": "Choose the option that best completes: Neither the principal nor the teachers ___ aware of the change.", "opts": ["was", "were", "is", "has been", "be"], "ans": 1, "topic": "Concord", "exp": "With neither...nor, the verb agrees with the nearer subject: teachers → were.", "id": 1}, {"subject": "English", "q": "If I ___ you, I would apologise immediately.", "opts": ["am", "was", "were", "be", "had been"], "ans": 2, "topic": "Conditional sentences", "exp": "The subjunctive were is standard after If I... in this hypothetical construction.", "id": 2}, {"subject": "English", "q": "The expression 'to hit the nail on the head' means to", "opts": ["miss the point", "make a serious mistake", "state exactly what is correct", "work very slowly", "avoid an issue"], "ans": 2, "topic": "Idioms", "exp": "It means to identify or state something exactly.", "id": 3}, {"subject": "English", "q": "The word nearest in meaning to 'meticulous' is", "opts": ["careless", "thorough", "hesitant", "generous", "reckless"], "ans": 1, "topic": "Synonyms", "exp": "Meticulous means very careful and thorough.", "id": 4}, {"subject": "English", "q": "The opposite of 'transient' is", "opts": ["temporary", "brief", "permanent", "uncertain", "fragile"], "ans": 2, "topic": "Antonyms", "exp": "Transient means short-lived; permanent is its opposite.", "id": 5}, {"subject": "English", "q": "The committee insisted ___ seeing the original document.", "opts": ["in", "on", "at", "for", "with"], "ans": 1, "topic": "Prepositions", "exp": "The correct collocation is insist on.", "id": 6}, {"subject": "English", "q": "Choose the correctly spelt word.", "opts": ["accomodation", "accommodation", "acommodation", "accommmodation", "accomodation"], "ans": 1, "topic": "Spelling", "exp": "Accommodation has double c and double m.", "id": 7}, {"subject": "English", "q": "'The man who won the prize is my uncle.' The underlined-type clause functions as a", "opts": ["noun clause", "adverbial clause", "relative/adjectival clause", "coordinate clause", "conditional clause"], "ans": 2, "topic": "Clauses", "exp": "The clause modifies man, so it is adjectival/relative.", "id": 8}, {"subject": "English", "q": "Which option is correctly punctuated?", "opts": ["However we continued, the rain was heavy.", "However, we continued although the rain was heavy.", "However we, continued although the rain was heavy.", "However; we continued, although the rain was heavy.", "However: we continued although, the rain was heavy."], "ans": 1, "topic": "Punctuation", "exp": "A comma follows the introductory conjunctive adverb However.", "id": 9}, {"subject": "English", "q": "A person who compiles a dictionary is a", "opts": ["biographer", "lexicographer", "calligrapher", "cartographer", "stenographer"], "ans": 1, "topic": "Vocabulary", "exp": "A lexicographer compiles or studies dictionaries.", "id": 10}, {"subject": "English", "q": "The students were asked to put ___ the meeting until Monday.", "opts": ["off", "out", "up", "over", "away"], "ans": 0, "topic": "Phrasal verbs", "exp": "Put off means postpone.", "id": 11}, {"subject": "English", "q": "The statement 'He is economical with the truth' suggests that he", "opts": ["always tells the truth", "avoids giving the full truth", "speaks loudly", "is financially poor", "forgets facts"], "ans": 1, "topic": "Sentence interpretation", "exp": "The expression is a euphemistic way of saying someone withholds or distorts some truth.", "id": 12}, {"subject": "English", "q": "Which word has the same vowel sound as 'seat' in standard English?", "opts": ["said", "sit", "beat", "set", "great"], "ans": 2, "topic": "Oral English", "exp": "Seat and beat contain the long /iː/ vowel.", "id": 13}, {"subject": "English", "q": "Which word has a different consonant sound for the letter 'c'?", "opts": ["city", "cent", "cycle", "cat", "cinema"], "ans": 3, "topic": "Oral English", "exp": "Cat begins with /k/ while the others have /s/.", "id": 14}, {"subject": "English", "q": "In the sentence 'The old man walked slowly', the word 'slowly' is a", "opts": ["noun", "adjective", "adverb", "preposition", "conjunction"], "ans": 2, "topic": "Parts of speech", "exp": "Slowly modifies the verb walked.", "id": 15}, {"subject": "English", "q": "The word 'benevolent' is nearest in meaning to", "opts": ["kind-hearted", "hostile", "stubborn", "timid", "noisy"], "ans": 0, "topic": "Synonyms", "exp": "Benevolent means well-meaning and kind.", "id": 16}, {"subject": "English", "q": "The opposite of 'scarce' is", "opts": ["rare", "limited", "abundant", "costly", "hidden"], "ans": 2, "topic": "Antonyms", "exp": "Scarce means insufficient or hard to find; abundant means plentiful.", "id": 17}, {"subject": "English", "q": "Choose the option that best completes: By the time we arrived, the lecture ___.", "opts": ["starts", "has started", "had started", "will start", "starting"], "ans": 2, "topic": "Tenses", "exp": "The earlier past action takes the past perfect: had started.", "id": 18}, {"subject": "English", "q": "The chairman, together with his advisers, ___ expected to attend.", "opts": ["are", "were", "is", "have been", "be"], "ans": 2, "topic": "Concord", "exp": "The subject is chairman; the intervening phrase does not change agreement.", "id": 19}, {"subject": "English", "q": "Which option best expresses: 'I regret that I did not study harder.'", "opts": ["I wish I had studied harder.", "I wish I study harder.", "I wished I study harder.", "I hope I studied harder.", "I regret to study harder."], "ans": 0, "topic": "Sentence transformation", "exp": "Past regret is commonly expressed with wish + past perfect.", "id": 20}, {"subject": "English", "q": "'The news was a bitter pill to swallow' is an example of", "opts": ["metaphor", "simile", "pun", "oxymoron", "alliteration"], "ans": 0, "topic": "Figures of speech", "exp": "The news is compared directly to a bitter pill.", "id": 21}, {"subject": "English", "q": "The doctor advised him to refrain ___ strenuous exercise.", "opts": ["to", "from", "with", "by", "at"], "ans": 1, "topic": "Prepositions", "exp": "Refrain is followed by from.", "id": 22}, {"subject": "English", "q": "Choose the option that best completes: Hardly had she arrived ___ the rain started.", "opts": ["than", "when", "then", "while", "and"], "ans": 1, "topic": "Conjunctions", "exp": "The standard pair is hardly...when.", "id": 23}, {"subject": "English", "q": "A speech delivered without preparation is", "opts": ["extempore", "epistolary", "anonymous", "satirical", "bilingual"], "ans": 0, "topic": "Register/vocabulary", "exp": "Extempore means without prior preparation.", "id": 24}, {"subject": "English", "q": "Which option is most appropriate in a formal letter?", "opts": ["I wanna know the result.", "Please, I need the result ASAP.", "I would appreciate receiving the result at your earliest convenience.", "Send me the result now.", "Kindly gimme the result."], "ans": 2, "topic": "Register", "exp": "The third option uses formal, appropriate register.", "id": 25}, {"subject": "English", "q": "The word 'ubiquitous' means", "opts": ["present everywhere", "extremely expensive", "very old", "difficult to understand", "carefully hidden"], "ans": 0, "topic": "Vocabulary", "exp": "Ubiquitous means found or appearing everywhere.", "id": 26}, {"subject": "English", "q": "If the instruction says 'He barely escaped', it means he", "opts": ["escaped easily", "did not escape", "escaped by a narrow margin", "escaped before the danger existed", "wanted to escape"], "ans": 2, "topic": "Sentence interpretation", "exp": "Barely means only just; the escape was narrowly achieved.", "id": 27}, {"subject": "English", "q": "Which option contains a dangling modifier?", "opts": ["Walking to school, I saw the accident.", "After reading the book, Tunde wrote a review.", "While cooking, the phone rang.", "Having finished the test, Ada left.", "Because he was tired, Musa rested."], "ans": 2, "topic": "Modifiers", "exp": "In the third, the phone—not the intended person—is grammatically made the subject of walking/cooking.", "id": 28}, {"subject": "English", "q": "Choose the correctly formed plural.", "opts": ["criterions", "criterias", "criteria", "criterionses", "criterium"], "ans": 2, "topic": "Number", "exp": "Criteria is the standard plural of criterion.", "id": 29}, {"subject": "English", "q": "The expression 'once in a blue moon' means", "opts": ["every day", "very rarely", "at night", "unexpectedly", "immediately"], "ans": 1, "topic": "Idioms", "exp": "It means very rarely.", "id": 30}, {"subject": "English", "q": "Which word is stressed differently from the others?", "opts": ["PREsent (noun)", "REcord (noun)", "PERmit (noun)", "reLAX (verb)", "CONduct (noun)"], "ans": 3, "topic": "Word stress", "exp": "Relax has final stress; the other listed forms have initial stress.", "id": 31}, {"subject": "English", "q": "The main purpose of a topic sentence is to", "opts": ["give a quotation", "state the central idea of a paragraph", "end an essay", "define every word", "provide a reference"], "ans": 1, "topic": "Comprehension", "exp": "A topic sentence introduces the paragraph’s main idea.", "id": 32}, {"subject": "English", "q": "A writer who presents evidence to convince readers is mainly using", "opts": ["persuasion", "description only", "narration only", "dialogue", "fiction"], "ans": 0, "topic": "Comprehension", "exp": "Persuasion aims to influence belief or action using reasons/evidence.", "id": 33}, {"subject": "English", "q": "In a passage, the word 'consequently' signals", "opts": ["contrast", "cause", "result", "example", "addition"], "ans": 2, "topic": "Cohesion", "exp": "Consequently introduces a result.", "id": 34}, {"subject": "English", "q": "The phrase 'in spite of the rain' can be replaced by", "opts": ["because of the rain", "despite the rain", "before the rain", "without rain", "during dry weather"], "ans": 1, "topic": "Sentence interpretation", "exp": "In spite of means despite.", "id": 35}, {"subject": "English", "q": "Choose the correct option: Each of the boys ___ a locker.", "opts": ["have", "has", "are having", "were given", "have had"], "ans": 1, "topic": "Concord", "exp": "Each is singular and takes has.", "id": 36}, {"subject": "English", "q": "Which word is closest in meaning to 'pragmatic'?", "opts": ["practical", "emotional", "imaginary", "careless", "theoretical"], "ans": 0, "topic": "Synonyms", "exp": "Pragmatic means practical and focused on workable results.", "id": 37}, {"subject": "English", "q": "The antonym of 'hostile' is", "opts": ["friendly", "violent", "aggressive", "bitter", "dangerous"], "ans": 0, "topic": "Antonyms", "exp": "Hostile means unfriendly or antagonistic.", "id": 38}, {"subject": "English", "q": "A person who cannot read or write is", "opts": ["illegible", "illiterate", "ineligible", "inarticulate", "illegal"], "ans": 1, "topic": "Vocabulary", "exp": "Illiterate describes inability to read/write.", "id": 39}, {"subject": "English", "q": "Which sentence is grammatically correct?", "opts": ["She is senior than me.", "She is senior to me.", "She is more senior to me.", "She is senior with me.", "She is most senior than me."], "ans": 1, "topic": "Comparatives", "exp": "Senior is conventionally followed by to, not than.", "id": 40}, {"subject": "English", "q": "'The wind whispered through the trees' illustrates", "opts": ["personification", "hyperbole", "irony", "euphemism", "litotes"], "ans": 0, "topic": "Figures of speech", "exp": "Whispering is a human action attributed to wind.", "id": 41}, {"subject": "English", "q": "Choose the word that best completes: The evidence was too ___ to ignore.", "opts": ["compelling", "compelled", "compel", "compulsion", "compellingly"], "ans": 0, "topic": "Word choice", "exp": "Compelling means strongly persuasive or convincing.", "id": 42}, {"subject": "English", "q": "Which option has the same meaning as 'No sooner had he arrived than the meeting began'?", "opts": ["He arrived after the meeting.", "The meeting began immediately after he arrived.", "He did not arrive.", "The meeting ended before he arrived.", "He arrived long before the meeting."], "ans": 1, "topic": "Sentence interpretation", "exp": "No sooner...than expresses an immediate sequence.", "id": 43}, {"subject": "English", "q": "In a scientific report, the most suitable register is generally", "opts": ["informal", "technical/formal", "slang", "comic", "conversational"], "ans": 1, "topic": "Register", "exp": "Scientific writing normally uses formal, precise language.", "id": 44}, {"subject": "English", "q": "Which word is correctly pronounced with stress on the second syllable?", "opts": ["PHOtograph", "phoTOGraphy", "TELephone", "CINema", "GOVernment"], "ans": 1, "topic": "Word stress", "exp": "Photography has primary stress on the second syllable.", "id": 45}, {"subject": "English", "q": "A passage that tells events in the order they occurred is mainly", "opts": ["narrative", "argumentative", "expository", "descriptive only", "persuasive only"], "ans": 0, "topic": "Comprehension", "exp": "Narration recounts events, commonly chronologically.", "id": 46}, {"subject": "English", "q": "The phrase 'on the contrary' is used mainly to indicate", "opts": ["addition", "contrast", "cause", "sequence", "example"], "ans": 1, "topic": "Cohesion", "exp": "It introduces an opposing or contrasting point.", "id": 47}, {"subject": "English", "q": "Choose the best completion: It is high time you ___ home.", "opts": ["go", "went", "will go", "have gone", "are going"], "ans": 1, "topic": "Subjunctive/tense", "exp": "After It is high time..., standard usage commonly uses the past form: went.", "id": 48}, {"subject": "English", "q": "Which option is an example of an oxymoron?", "opts": ["deafening silence", "bright sun", "running water", "green grass", "cold water"], "ans": 0, "topic": "Figures of speech", "exp": "Oxymoron combines apparently contradictory terms.", "id": 49}, {"subject": "English", "q": "The word 'obsolete' means", "opts": ["modern", "no longer in use", "expensive", "dangerous", "portable"], "ans": 1, "topic": "Vocabulary", "exp": "Obsolete means out of date or no longer used.", "id": 50}, {"subject": "English", "q": "Choose the correct option: The police ___ investigating the case.", "opts": ["is", "was", "are", "has", "be"], "ans": 2, "topic": "Concord", "exp": "Police is treated as a plural collective noun in this construction.", "id": 51}, {"subject": "English", "q": "Which sentence has the correct use of 'its/it's'?", "opts": ["The dog wagged it’s tail.", "Its raining outside.", "The company changed its policy.", "It’s policy changed yesterday.", "The bird hurt its wing, it’s true."], "ans": 2, "topic": "Usage", "exp": "Its is the possessive form; it’s means it is/it has.", "id": 52}, {"subject": "English", "q": "The idiom 'to spill the beans' means to", "opts": ["waste food", "reveal a secret", "cook quickly", "make a mess", "avoid speaking"], "ans": 1, "topic": "Idioms", "exp": "It means disclose secret information.", "id": 53}, {"subject": "English", "q": "Which option best completes: Not only did he apologise, ___ he paid for the damage.", "opts": ["but also", "and also", "but", "also", "than"], "ans": 0, "topic": "Correlative conjunctions", "exp": "The standard pair is not only...but also.", "id": 54}, {"subject": "English", "q": "The author's attitude toward a subject can often be inferred from", "opts": ["only the title", "word choice and tone", "the page number", "the font size", "the length alone"], "ans": 1, "topic": "Comprehension", "exp": "Tone and diction provide evidence of attitude.", "id": 55}, {"subject": "English", "q": "Choose the option nearest in meaning to 'reluctant'.", "opts": ["unwilling", "eager", "certain", "generous", "carefree"], "ans": 0, "topic": "Synonyms", "exp": "Reluctant means unwilling or hesitant.", "id": 56}, {"subject": "English", "q": "The opposite of 'explicit' is", "opts": ["clear", "direct", "implicit", "exact", "obvious"], "ans": 2, "topic": "Antonyms", "exp": "Explicit is directly stated; implicit is understood rather than directly stated.", "id": 57}, {"subject": "English", "q": "A group of words that contains a subject and predicate but does not express a complete thought is a", "opts": ["phrase", "subordinate clause", "simple sentence", "compound sentence", "word"], "ans": 1, "topic": "Grammar", "exp": "A subordinate clause has subject and predicate but depends on another clause.", "id": 58}, {"subject": "English", "q": "Which option best completes: The manager asked whether the report ___ ready.", "opts": ["is", "was", "were", "be", "has"], "ans": 1, "topic": "Reported speech", "exp": "With a past reporting verb, backshift commonly gives was.", "id": 59}, {"subject": "English", "q": "A 'biannual' event occurs", "opts": ["once a year", "twice a year", "every two years", "every month", "every week"], "ans": 1, "topic": "Vocabulary", "exp": "Biannual commonly means twice yearly.", "id": 60}, {"subject": "Biology", "q": "Which organelle is primarily responsible for ATP production during aerobic respiration?", "opts": ["Ribosome", "Mitochondrion", "Golgi apparatus", "Lysosome", "Vacuole"], "ans": 1, "topic": "Cell biology", "exp": "Most aerobic ATP production occurs at the inner mitochondrial membrane.", "id": 61}, {"subject": "Biology", "q": "The movement of water molecules across a selectively permeable membrane from higher to lower water potential is", "opts": ["active transport", "osmosis", "diffusion of solute", "transpiration", "plasmolysis"], "ans": 1, "topic": "Transport", "exp": "Osmosis is water movement down a water-potential gradient through a selectively permeable membrane.", "id": 62}, {"subject": "Biology", "q": "Which tissue transports manufactured food in flowering plants?", "opts": ["Xylem", "Phloem", "Cambium", "Epidermis", "Sclerenchyma"], "ans": 1, "topic": "Plant transport", "exp": "Phloem translocates organic assimilates such as sucrose.", "id": 63}, {"subject": "Biology", "q": "The opening and closing of stomata is mainly controlled by", "opts": ["root hairs", "guard cells", "companion cells", "xylem vessels", "palisade cells"], "ans": 1, "topic": "Plant physiology", "exp": "Changes in guard-cell turgor regulate stomatal aperture.", "id": 64}, {"subject": "Biology", "q": "The end products of aerobic respiration in mammals are", "opts": ["glucose and oxygen", "carbon dioxide, water and energy", "lactic acid and oxygen", "ethanol and carbon dioxide", "starch and water"], "ans": 1, "topic": "Respiration", "exp": "Complete oxidation of glucose produces CO2, water and released energy.", "id": 65}, {"subject": "Biology", "q": "Which blood vessel carries oxygenated blood from the lungs to the heart?", "opts": ["Pulmonary artery", "Pulmonary vein", "Aorta", "Vena cava", "Hepatic portal vein"], "ans": 1, "topic": "Circulation", "exp": "The pulmonary vein returns oxygenated blood to the left atrium.", "id": 66}, {"subject": "Biology", "q": "The functional unit of the kidney is the", "opts": ["neuron", "nephron", "alveolus", "villlus", "sarcomere"], "ans": 1, "topic": "Excretion", "exp": "The nephron performs filtration, reabsorption and secretion.", "id": 67}, {"subject": "Biology", "q": "Ultrafiltration occurs mainly at the", "opts": ["loop of Henle", "glomerulus and Bowman's capsule", "collecting duct", "ureter", "renal pelvis"], "ans": 1, "topic": "Excretion", "exp": "High pressure in the glomerulus forces small molecules into Bowman’s capsule.", "id": 68}, {"subject": "Biology", "q": "Which hormone lowers blood glucose concentration?", "opts": ["Glucagon", "Insulin", "Adrenaline", "Thyroxine", "ADH"], "ans": 1, "topic": "Homeostasis", "exp": "Insulin promotes glucose uptake and storage, lowering blood glucose.", "id": 69}, {"subject": "Biology", "q": "The reflex arc is coordinated rapidly through the", "opts": ["cerebrum only", "spinal cord", "kidney", n", "exp": "Bile salts break fat into small droplets, increasing surface area for lipase.", "id": 82}, {"subject": "Biology", "q": "The enzyme that begins starch digestion in the mouth is", "opts": ["pepsin", "amylase", "lipase", "trypsin", "maltase"], "ans": 1, "topic": "Nutrition", "exp": "Salivary amylase begins starch digestion in the mouth.", "id": 83}, {"subject": "Biology", "q": "The villi of the small intestine mainly increase", "opts": ["blood pressure", "surface area for absorption", "stomach acidity", "bile production", "urine volume"], "ans": 1, "topic": "Nutrition", "exp": "Villi and microvilli greatly increase absorptive surface area.", "id": 84}, {"subject": "Biology", "q": "Which structure prevents food from entering the trachea during swallowing?", "opts": ["Uvula", "Epiglottis", "Diaphragm", "Larynx", "Bronchiole"], "ans": 1, "topic": "Human biology", "exp": "The epiglottis helps cover the airway during swallowing.", "id": 85}, {"subject": "Biology", "q": "During inhalation in a healthy human, the diaphragm", "opts": ["relaxes and domes upward", "contracts and flattens", "remains motionless", "closes the trachea", "contracts and moves upward"], "ans": 1, "topic": "Respiration", "exp": "Diaphragm contraction flattens it, increasing thoracic volume.", "id": 86}, {"subject": "Biology", "q": "Which part of a flower receives pollen grains?", "opts": ["Anther", "Stigma", "Ovary", "Sepal", "Filament"], "ans": 1, "topic": "Reproduction", "exp": "The stigma is the receptive surface for pollen.", "id": 87}, {"subject": "Biology", "q": "Double fertilization in flowering plants produces", "opts": ["two embryos", "a diploid zygote and triploid endosperm", "two pollen grains", "only endosperm", "haploid seed only"], "ans": 1, "topic": "Plant reproduction", "exp": "One sperm fertilizes the egg; the other fuses with polar nuclei to form triploid endosperm.", "id": 88}, {"subject": "Biology", "q": "Asexual reproduction generally produces offspring that are", "opts": ["genetically identical to the parent, except for mutation", "always genetically different", "always sterile", "formed only by meiosis", "formed only in animals"], "ans": 0, "topic": "Reproduction", "exp": "Asexual reproduction involves one parent and normally no fusion of gametes.", "id": 89}, {"subject": "Biology", "q": "Which disease is caused by a protozoan parasite?", "opts": ["Malaria", "Tuberculosis", "Cholera", "Ringworm", "Hepatitis B"], "ans": 0, "topic": "Disease", "exp": "Malaria is caused by Plasmodium species.", "id": 90}, {"subject": "Biology", "q": "Vaccination protects primarily by", "opts": ["destroying all microbes immediately", "stimulating immune memory", "increasing body temperature permanently", "removing red blood cells", "preventing all mutations"], "ans": 1, "topic": "Immunity", "exp": "Vaccines prime adaptive immune memory for faster future responses.", "id": 91}, {"subject": "Biology", "q": "Which structure connects a muscle to a bone?", "opts": ["Ligament", "Tendon", "Cartilage", "Neuron", "Synovial membrane"], "ans": 1, "topic": "Support and movement", "exp": "Tendons attach muscles to bones; ligaments connect bones.", "id": 92}, {"subject": "Biology", "q": "The joint at the elbow is mainly a", "opts": ["ball-and-socket joint", "hinge joint", "pivot joint", "fixed joint", "gliding joint"], "ans": 1, "topic": "Support and movement", "exp": "The elbow permits flexion and extension like a hinge.", "id": 93}, {"subject": "Biology", "q": "In a typical ecosystem, energy decreases at successive trophic levels mainly because", "opts": ["energy is destroyed", "much energy is lost as heat through metabolism", "plants stop photosynthesis", "consumers create energy", "decomposers remove sunlight"], "ans": 1, "topic": "Energy flow", "exp": "Respiration and other metabolic processes dissipate much energy as heat.", "id": 94}, {"subject": "Biology", "q": "Which ecological relationship benefits both species?", "opts": ["Parasitism", "Mutualism", "Predation", "Competition", "Amensalism"], "ans": 1, "topic": "Ecology", "exp": "Mutualism is +/+ for both partners.", "id": 95}, {"subject": "Biology", "q": "A population grows rapidly when", "opts": ["births and immigration greatly exceed deaths and emigration", "deaths always exceed births", "food is absent", "competition is maximum", "all organisms are sterile"], "ans": 0, "topic": "Population ecology", "exp": "Population size rises when additions exceed losses.", "id": 96}, {"subject": "Biology", "q": "Which feature is an adaptation of a xerophyte?", "opts": ["Large thin leaves", "Sunken stomata and reduced leaves", "Very large stomatal openings", "Soft aquatic roots", "No cuticle"], "ans": 1, "topic": "Adaptation", "exp": "Sunken stomata and reduced leaf area reduce water loss.", "id": 97}, {"subject": "Biology", "q": "A control in an experiment is useful because it", "opts": ["guarantees the hypothesis is true", "provides a comparison for the experimental treatment", "changes every variable", "removes the need for measurements", "always produces the highest value"], "ans": 1, "topic": "Experimental biology", "exp": "A control provides a baseline against which treatment effects can be compared.", "id": 98}, {"subject": "Biology", "q": "If a plant is kept in darkness for several days, which process is most directly prevented?", "opts": ["Photosynthesis", "Respiration", "Water absorption", "Mineral uptake", "Transpiration completely"], "ans": 0, "topic": "Photosynthesis", "exp": "Light is required for the light-dependent stage of photosynthesis.", "id": 99}, {"subject": "Biology", "q": "The Casparian strip is found in the", "opts": ["epidermis of a leaf", "endodermis of a root", "phloem companion cell", "palisade mesophyll", "stomatal pore"], "ans": 1, "topic": "Plant anatomy", "exp": "The Casparian strip in endodermal cell walls regulates apoplastic flow into the stele.", "id": 100}, {"subject": "Chemistry", "q": "How many moles are present in 18 g of water, H2O? (H=1, O=16)", "opts": ["0.5", "1.0", "2.0", "18", "36"], "ans": 1, "topic": "Mole concept", "exp": "Molar mass of H2O is 18 g mol−1, so 18/18 = 1 mol.", "id": 101}, {"subject": "Chemistry", "q": "What is the empirical formula of a compound containing 40% carbon, 6.7% hydrogen and 53.3% oxygen?", "opts": ["CH2O", "C2H4O2", "CHO", "CH4O", "C3H6O3"], "ans": 0, "topic": "Empirical formula", "exp": "Assuming 100 g: C 3.33, H 6.7, O 3.33; ratio 1:2:1 → CH2O.", "id": 102}, {"subject": "Chemistry", "q": "The electronic configuration of sodium (Z=11) is", "opts": ["2,8,1", "2,7,2", "2,8,2", "2,6,3", "2,9"], "ans": 0, "topic": "Atomic structure", "exp": "Sodium has 11 electrons: 2,8,1.", "id": 103}, {"subject": "Chemistry", "q": "Which particle determines the atomic number of an element?", "opts": ["Neutron", "Electron", "Proton", "Nucleon pair", "Photon"], "ans": 2, "topic": "Atomic structure", "exp": "Atomic number equals the number of protons.", "id": 104}, {"subject": "Chemistry", "q": "Isotopes are atoms of the same element with", "opts": ["different protons and same neutrons", "same protons but different neutrons", "same mass and different protons", "different electrons only", "different atomic numbers"], "ans": 1, "topic": "Isotopes", "exp": "Isotopes share atomic number but differ in neutron number.", "id": 105}, {"subject": "Chemistry", "q": "Across a period, atomic radius generally", "opts": ["increases greatly", "decreases from left to right", "remains constant", "becomes zero", "changes randomly"], "ans": 1, "topic": "Periodicity", "exp": "Increasing nuclear charge pulls electrons closer across a period.", "id": 106}, {"subject": "Chemistry", "q": "The bond in sodium chloride is mainly", "opts": ["metallic", "ionic", "coordinate covalent", "hydrogen", "non-polar covalent"], "ans": 1, "topic": "Bonding", "exp": "Na transfers an electron to Cl, forming oppositely charged ions.", "id": 107}, {"subject": "Chemistry", "q": "Which gas law states that at constant temperature, pressure is inversely proportional to volume?", "opts": ["Charles law", "Boyle law", "Avogadro law", "Graham law", "Dalton law"], "ans": 1, "topic": "Gas laws", "exp": "Boyle’s law: P ∝ 1/V at constant temperature.", "id": 108}, {"subject": "Chemistry", "q": "A gas occupies 2 L at 1 atm. At constant temperature, its volume at 2 atm is", "opts": ["0.5 L", "1 L", "2 L", "4 L", "8 L"], "ans": 1, "topic": "Gas laws", "exp": "P1V1=P2V2: 1×2=2×V2, so V2=1 L.", "id": 109}, {"subject": "Chemistry", "q": "Which acid is diprotic?", "opts": ["HCl", "HNO3", "H2SO4", "CH3COOH", "HBr"], "ans": 2, "topic": "Acids and bases", "exp": "Sulfuric acid can donate two protons.", "id": 110}, {"subject": "Chemistry", "q": "A solution with pH 3 is how many times more acidic than a solution with pH 5?", "opts": ["2", "10", "100", "1000", "0.01"], "ans": 2, "topic": "Acids and bases", "exp": "Each pH unit represents a tenfold change; two units = 100-fold.", "id": 111}, {"subject": "Chemistry", "q": "Which indicator is generally suitable for a strong acid–strong base titration?", "opts": ["Methyl orange only", "Phenolphthalein only", "Either methyl orange or phenolphthalein", "Starch only", "Iodine"], "ans": 2, "topic": "Titration", "exp": "Both have transition ranges within the steep pH change of a strong acid–strong base titration.", "id": 112}, {"subject": "Chemistry", "q": "Oxidation is best defined in terms of electrons as", "opts": ["gain of electrons", "loss of electrons", "gain of neutrons", "loss of protons", "gain of atoms"], "ans": 1, "topic": "Redox", "exp": "Oxidation is loss of electrons (OIL: Oxidation Is Loss).", "id": 113}, {"subject": "Chemistry", "q": "In the reaction Zn + CuSO4 → ZnSO4 + Cu, zinc is", "opts": ["reduced", "oxidized", "a catalyst", "unchanged", "the oxidizing agent"], "ans": 1, "topic": "Redox", "exp": "Zn loses electrons to form Zn2+, so it is oxidized.", "id": 114}, {"subject": "Chemistry", "q": "The electrode at which reduction occurs is the", "opts": ["anode", "cathode", "salt bridge", "electrolyte", "wire"], "ans": 1, "topic": "Electrochemistry", "exp": "Reduction occurs at the cathode.", "id": 115}, {"subject": "Chemistry", "q": "Which method best separates ethanol from water?", "opts": ["Filtration", "Simple sublimation", "Fractional distillation", "Decantation", "Magnetic separation"], "ans": 2, "topic": "Separation techniques", "exp": "The liquids have different boiling points and are miscible, so fractional distillation is appropriate.", "id": 116}, {"subject": "Chemistry", "q": "Which reagent can distinguish chloride ions from nitrate ions in solution?", "opts": ["AgNO3 after acidifying appropriately", "NaCl", "Distilled water", "Ethanol only", "Copper metal"], "ans": 0, "topic": "Qualitative analysis", "exp": "Acidified silver nitrate gives a white AgCl precipitate with chloride.", "id": 117}, {"subject": "Chemistry", "q": "A catalyst increases reaction rate mainly by", "opts": ["increasing enthalpy change", "lowering activation energy", "raising product energy only", "being permanently consumed", "changing equilibrium constant"], "ans": 1, "topic": "Rates of reaction", "exp": "Catalysts provide an alternative pathway with lower activation energy.", "id": 118}, {"subject": "Chemistry", "q": "Increasing temperature generally increases reaction rate because particles", "opts": ["become larger", "have more frequent effective collisions", "lose all kinetic energy", "stop colliding", "become ions"], "ans": 1, "topic": "Kinetics", "exp": "Higher temperature increases kinetic energy and the fraction of collisions above activation energy.", "id": 119}, {"subject": "Chemistry", "q": "For an exothermic reaction, the products have", "opts": ["higher enthalpy than reactants", "lower enthalpy than reactants", "equal enthalpy always", "zero energy", "infinite energy"], "ans": 1, "topic": "Energetics", "exp": "Energy is released, so products lie at lower enthalpy.", "id": 120}, {"subject": "Chemistry", "q": "Dynamic equilibrium occurs when", "opts": ["reaction stops completely", "forward and reverse reaction rates are equal", "only products remain", "only reactants remain", "temperature is zero"], "ans": 1, "topic": "Equilibrium", "exp": "At dynamic equilibrium, both directions continue at equal rates.", "id": 121}, {"subject": "Chemistry", "q": "Adding more reactant to a system at equilibrium generally shifts equilibrium toward", "opts": ["reactants", "products, if the added reactant is consumed in the forward reaction", "no side always", "the catalyst", "the solvent only"], "ans": 1, "topic": "Equilibrium", "exp": "Le Chatelier’s principle predicts consumption of added reactant.", "id": 122}, {"subject": "Chemistry", "q": "Which hydrocarbon is saturated?", "opts": ["Ethene", "Ethyne", "Ethane", "Propene", "Benzene only"], "ans": 2, "topic": "Organic chemistry", "exp": "Alkanes such as ethane contain only single C–C bonds.", "id": 123}, {"subject": "Chemistry", "q": "The functional group of alcohols is", "opts": ["−COOH", "−OH", "−CHO", "−COO−", "−NH2"], "ans": 1, "topic": "Organic chemistry", "exp": "Alcohols contain the hydroxyl group, −OH.", "id": 124}, {"subject": "Chemistry", "q": "Ethene decolourises bromine water because it undergoes", "opts": ["substitution", "addition", "neutralisation", "oxidation only", "polymerisation only"], "ans": 1, "topic": "Organic chemistry", "exp": "The C=C double bond undergoes addition with bromine.", "id": 125}, {"subject": "Chemistry", "q": "The monomer used to make polyethene is", "opts": ["ethane", "ethene", "ethanol", "ethyne", "benzene"], "ans": 1, "topic": "Polymers", "exp": "Polyethene is formed by addition polymerisation of ethene.", "id": 126}, {"subject": "Chemistry", "q": "Which metal is extracted by electrolysis of its molten compound because it is highly reactive?", "opts": ["Copper", "Sodium", "Silver", "Gold", "Mercury"], "ans": 1, "topic": "Metals", "exp": "Sodium is too reactive to be obtained by ordinary carbon reduction. ect": "Physics", "q": "If a metal rod is heated and expands, its length increases mainly because", "opts": ["its atoms become larger", "average atomic separation increases", "new atoms are created", "its mass doubles", "gravity decreases"], "ans": 1, "topic": "Thermal expansion", "exp": "Heating increases atomic vibration and average separation.", "id": 158}, {"subject": "Physics", "q": "At constant pressure, the volume of a fixed mass of gas is proportional to", "opts": ["absolute temperature", "pressure", "density only", "mass squared", "time"], "ans": 0, "topic": "Gas laws", "exp": "Charles law: V ∝ T at constant pressure.", "id": 159}, {"subject": "Physics", "q": "A wave has frequency 5 Hz and wavelength 2 m. Its speed is", "opts": ["0.4 m/s", "2.5 m/s", "7 m/s", "10 m/s", "25 m/s"], "ans": 3, "topic": "Waves", "exp": "v=fλ=5×2=10 m/s.", "id": 160}, {"subject": "Physics", "q": "Sound cannot travel through", "opts": ["air", "water", "steel", "vacuum", "wood"], "ans": 3, "topic": "Sound", "exp": "Sound is a mechanical wave and needs a medium.", "id": 161}, {"subject": "Physics", "q": "The pitch of a sound depends mainly on its", "opts": ["frequency", "amplitude", "speed", "wavelength only", "intensity only"], "ans": 0, "topic": "Sound", "exp": "Higher frequency corresponds to higher pitch.", "id": 162}, {"subject": "Physics", "q": "When light passes from air into glass, it generally bends", "opts": ["away from the normal", "toward the normal", "without changing direction always", "backward", "into a vacuum"], "ans": 1, "topic": "Light/refraction", "exp": "Entering a denser medium, light slows and bends toward the normal.", "id": 163}, {"subject": "Physics", "q": "The image formed by a plane mirror is", "opts": ["real and inverted", "virtual and upright", "real and upright", "virtual and inverted", "always magnified"], "ans": 1, "topic": "Light", "exp": "A plane mirror forms a virtual, upright image of equal size.", "id": 164}, {"subject": "Physics", "q": "A convex t": "Physics", "q": "Mass and energy are related by", "opts": ["E=mc²", "E=mv", "F=mc", "P=IV only", "V=IR"], "ans": 0, "topic": "Modern physics", "exp": "Einstein’s mass-energy relation is E=mc².", "id": 178}, {"subject": "Physics", "q": "The pressure in a liquid at a point increases with", "opts": ["depth", "surface area only", "colour", "container shape only", "temperature only"], "ans": 0, "topic": "Fluid pressure", "exp": "Hydrostatic pressure increases with depth: p=ρgh.", "id": 179}, {"subject": "Physics", "q": "A force of 20 N moves an object 3 m in the direction of the force. Work done is", "opts": ["6 J", "17 J", "23 J", "60 J", "80 J"], "ans": 3, "topic": "Work energy power", "exp": "W=Fs=20×3=60 J.", "id": 180}];
const KEY='elite_utme_mock_v1';
const subjects=[['English','Use of English',60],['Biology','Biology',40],['Chemistry','Chemistry',40],['Physics','Physics',40]];
let state=load()||{screen:'intro',started:false,submitted:false,current:0,answers:{},flags:{},startedAt:null,remaining:7200,lastTick:null,warn30:false,warn10:false};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function fmt(t){t=Math.max(0,Math.floor(t));let h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return [h,m,s].map((x,i)=>i===0?String(x).padStart(2,'0'):String(x).padStart(2,'0')).join(':')}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function idxBySubject(s){let a=[];BANK.forEach((q,i)=>{if(q.subject===s)a.push(i)});return a}
function qnum(i){return i+1}
function render(){document.getElementById('app').innerHTML=state.screen==='intro'?intro():state.screen==='exam'?exam():result(); if(state.screen==='exam') startTick();}
function intro(){let saved=state.started&&!state.submitted;return `<div class="screen intro"><div class="brand">ELITE MODE • CBT SIMULATOR</div><h1>FULL UTME MOCK EXAMINATION</h1><p>A serious 180-question UTME-style simulation designed for mobile CBT practice. Questions are original UTME-style items aligned to the official IBASS syllabus structure; they are not represented as JAMB past questions.</p><div class="rules"><div class="stats"><div class="stat"><span>Use of English</span><b>60</b></div><div class="stat"><span>Biology</span><b>40</b></div><div class="stat"><span>Chemistry</span><b>40</b></div><div class="stat"><span>Physics</span><b>40</b></div><div class="stat"><span>Total questions</span><b>180</b></div><div class="stat"><span>Duration</span><b>120 min</b></div></div><p><b>Instructions:</b> Select one answer per question. You may move freely, clear answers, flag questions and submit at any time. Answers are saved locally during this session. At submission, your score and full error analysis become available.</p></div><button class="primary" onclick="startExam()">${saved?'RESUME EXAMINATION':'START EXAMINATION'}</button>${saved?'<button class="small" style="width:100%;margin-top:9px" onclick="resetExam()">Start a fresh examination</button>':''}</div>`}
function startExam(){if(!state.started){state.started=true;state.startedAt=Date.now();state.lastTick=Date.now();state.remaining=7200;state.warn30=false;state.warn10=false;state.screen='exam';save();render()}else{state.screen='exam';save();render()}}
function resetExam(){if(confirm('Start a fresh examination? Current answers will be erased.')){localStorage.removeItem(KEY);state={screen:'intro',started:false,submitted:false,current:0,answers:{},flags:{},startedAt:null,remaining:7200,lastTick:null,warn30:false,warn10:false};render()}}
let tickHandle=null;
function startTick(){if(tickHandle)clearInterval(tickHandle);tickHandle=setInterval(()=>{if(state.screen!=='exam'){clearInterval(tickHandle);return}let now=Date.now(),d=Math.floor((now-(state.lastTick||now))/1000);if(d>0){state.remaining-=d;state.lastTick=now;save()}if(state.remaining<=0){state.remaining=0;save();clearInterval(tickHandle);autoSubmit();return}if(state.remaining<=1800&&!state.warn30){state.warn30=true;save();alert('30 MINUTES REMAINING.');}if(state.remaining<=600&&!state.warn10){state.warn10=true;save();alert('10 MINUTES REMAINING.');}updateTimer()},1000)}
function updateTimer(){let e=document.getElementById('timer');if(e){e.textContent=fmt(state.remaining);e.className='timer '+(state.remaining<=600?'danger':state.remaining<=1800?'warn':'')}}
function cur(){return BANK[state.current]}
function answeredCount(){return Object.keys(state.answers).length}
function subjectAnswered(s){return idxBySubject(s).filter(i=>state.answers[i]!==undefined).length}
function exam(){let q=cur(), sub=subjects.find(x=>x[0]===q.subject);let pct=((state.current+1)/180*100).toFixed(1);return `<div class="screen"><div class="top"><div class="toprow"><div><div class="subject">${esc(sub[1])}</div><div class="muted" style="font-size:.72rem">Question ${state.current+1} / 180</div></div><div id="timer" class="timer">${fmt(state.remaining)}</div></div><div class="progress"><i style="width:${pct}%"></i></div></div><div class="wrap"><div class="subjectbar">${subjects.map(x=>`<button class="chip ${q.subject===x[0]?'active':''}" onclick="jump(${idxBySubject(x[0])[0]})">${x[1]} <b>${subjectAnswered(x[0])}/${x[2]}</b></button>`).join('')}</div><div class="grid"><main><div class="card qcard"><div class="meta"><span>QUESTION ${state.current+1}</span><span>${esc(q.subject)}</span></div><div class="qtext">${esc(q.q)}</div><div class="options">${q.opts.map((o,j)=>`<button class="opt ${state.answers[state.current]===j?'selected':''}" onclick="answer(${j})"><span class="letter">${'ABCDE'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="actions"><button class="small flag ${state.flags[state.current]?'on':''}" onclick="toggleFlag()">${state.flags[state.current]?'⚑ Flagged':'⚐ Flag'}</button><button class="small" onclick="clearAnswer()">Clear answer</button></div></div><div class="nav"><button onclick="move(-1)" ${state.current===0?'disabled':''}>Previous</button><button class="next" onclick="move(1)" ${state.current===179?'disabled':''}>Next</button></div></main><aside class="card side"><h3>Question Navigator</h3><div class="legend"><span><i class="dot a"></i>Answered</span><span><i class="dot f"></i>Flagged</span><span><i class="dot c"></i>Current</span></div><div class="sideStats"><div class="sideStat">Answered<b>${answeredCount()}/180</b></div><div class="sideStat">Flagged<b>${Object.keys(state.flags).length}</b></div></div><div class="nums">${BANK.map((x,i)=>`<button class="num ${state.answers[i]!==undefined?'answered':''} ${state.flags[i]?'flagged':''} ${i===state.current?'current':''}" onclick="go(${i})">${i+1}</button>`).join('')}</div><button class="primary submit" style="margin-top:12px" onclick="confirmSubmit()">SUBMIT EXAMINATION</button></aside></div></div></div>`}
function answer(j){state.answers[state.current]=j;save();render()}
function clearAnswer(){delete state.answers[state.current];save();render()}
function toggleFlag(){state.flags[state.current]=!state.flags[state.current];if(!state.flags[state.current])delete state.flags[state.current];save();render()}
function move(d){let n=Math.max(0,Math.min(179,state.current+d));state.current=n;save();render()}
function go(i){state.current=i;save();render()}
function jump(i){go(i)}
function confirmSubmit(){let unanswered=180-answeredCount(),flags=Object.keys(state.flags).length;if(confirm(`Are you sure you want to submit? You still have ${unanswered} unanswered question${unanswered===1?'':'s'} and ${flags} flagged question${flags===1?'':'s'}.`)) submit()}
function autoSubmit(){submit(true)}
function submit(timeup=false){state.submitted=true;state.screen='result';state.timeup=!!timeup;save();render();window.scrollTo(0,0)}
function grade(){let correct=0,wrong=0;let by={};BANK.forEach((q,i)=>{if(!by[q.subject])by[q.subject]={correct:0,attempted:0,total:0,errors:[]};let b=by[q.subject];b.total++;if(state.answers[i]!==undefined){b.attempted++;if(state.answers[i]===q.ans){correct++;b.correct++}else{wrong++;b.errors.push(i)}}});return {correct,wrong,unanswered:180-answeredCount(),by}}
function result(){let g=grade(),used=Math.max(0,7200-state.remaining),acc=(g.correct/180*100).toFixed(1),attempted=answeredCount();let subj=subjects.map(x=>{let b=g.by[x[0]];return `<div class="resultcard"><h3>${x[1]}</h3><div style="display:flex;justify-content:space-between"><b>${b.correct}/${b.total}</b><span>${(b.correct/b.total*100).toFixed(1)}%</span></div><div class="bar"><i style="width:${b.correct/b.total*100}%"></i></div><p class="muted">Attempted ${b.attempted}/${b.total} • Errors ${b.errors.length}</p></div>`}).join('');let errs=BANK.map((q,i)=>{if(state.answers[i]===undefined||state.answers[i]===q.ans)return '';let ca=q.opts[q.ans],ua=q.opts[state.answers[i]];return `<div class="err"><strong>Q${i+1} • ${esc(q.topic)}</strong><span class="answerTag wrong">Your answer: ${'ABCDE'[state.answers[i]]} — ${esc(ua)}</span><span class="answerTag correct">Correct: ${'ABCDE'[q.ans]} — ${esc(ca)}</span><p>${esc(q.exp)}</p><span class="muted">Possible diagnosis: ${diagnosis(q,i)}</span></div>`}).join('');let strengths=subjects.slice().sort((a,b)=>g.by[b[0]].correct/b[2]-g.by[a[0]].correct/a[2]).slice(0,3).map(x=>x[1]).join(' • ');let weaknesses=subjects.slice().sort((a,b)=>g.by[a[0]].correct/a[2]-g.by[b[0]].correct/b[2]).slice(0,3).map(x=>x[1]).join(' • ');return `<div class="result"><div class="scorehero"><div class="brand" style="color:#bcd0ff">ELITE MODE • RESULT</div><h1>🏆 UTME MOCK RESULT</h1><div class="scoregrid">${subjects.map(x=>`<div class="scorebox"><span>${x[1]}</span><b>${g.by[x[0]].correct}/${x[2]}</b></div>`).join('')}<div class="scorebox"><span>RAW TOTAL</span><b>${g.correct}/180</b></div><div class="scorebox"><span>ACCURACY</span><b>${acc}%</b></div><div class="scorebox"><span>TIME USED</span><b>${fmt(used)}</b></div><div class="scorebox"><span>ATTEMPTED</span><b>${attempted}/180</b></div></div>${state.timeup?'<p><b>TIME UP — YOUR EXAMINATION HAS BEEN SUBMITTED.</b></p>':''}<p class="muted" style="color:#d9e2f3">This is a raw-score simulation. No 400-scale conversion is applied.</p></div><div class="resultgrid">${subj}</div><div class="resultcard" style="margin-top:14px"><h2>Performance Diagnosis</h2><p><b>Top strengths:</b> ${esc(strengths)}</p><p><b>Priority weaknesses:</b> ${esc(weaknesses)}</p><p><b>Top 3 revision priorities:</b></p><ol>${topTopics(g).map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div><div class="resultcard" style="margin-top:14px"><h2>Error Analysis</h2><div class="errors">${errs||'<p>Excellent — no incorrect answered questions. Review unanswered questions separately below.</p>'}</div></div><div class="resultcard review"><h2>Review Answers</h2><p class="muted">Correct answers and explanations are intentionally revealed only after submission.</p>${BANK.map((q,i)=>`<details><summary><b>Q${i+1} — ${esc(q.subject)}</b> · ${state.answers[i]===undefined?'Unanswered':state.answers[i]===q.ans?'Correct':'Incorrect'}</summary><div style="padding:12px 0"><div class="qtext">${esc(q.q)}</div><p>Your answer: <b>${state.answers[i]===undefined?'Unanswered':`${'ABCDE'[state.answers[i]]}. ${esc(q.opts[state.answers[i]])}`}</b></p><p>Correct answer: <b>${'ABCDE'[q.ans]}. ${esc(q.opts[q.ans])}</b></p><p><b>Topic:</b> ${esc(q.topic)}</p><p>${esc(q.exp)}</p></div></details>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="resetExam()">START NEW MOCK</button></div>`}
function diagnosis(q,i){let a=state.answers[i];if(/moles|volume|mass|speed|velocity|force|resistance|current|potential|work|energy|power|ratio|pH|pressure|temperature|concentration|stoichiometry|calculation/i.test(q.topic+' '+q.q))return 'Possible calculation/application error (review the setup and arithmetic).';return 'Possible knowledge or concept error; confirm the underlying rule before repeating the question.'}
function topTopics(g){let map={};BANK.forEach((q,i)=>{if(state.answers[i]!==undefined&&state.answers[i]!==q.ans)map[q.topic]=(map[q.topic]||0)+1});return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>`${x[0]} (${x[1]} error${x[1]>1?'s':''})`).concat(['Redo flagged/unanswered questions']).slice(0,3)}
render();
</script></body></html>
